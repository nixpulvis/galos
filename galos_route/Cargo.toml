[package]
name = "galos_route"
version = "0.0.1"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2024"
rust-version.workspace = true

# The router: a jump graph over the galaxy an index directory holds, the
# supercharge highway planned over the boost stars, and the order a set of
# destinations is best flown in. No renderer and no database; the map draws
# what it finds and `galos route` could ask it from the command line.
[dependencies]
galos_index = { path = "../galos_index" }
# The positions a route is worked out in. The same glam the map's bevy
# re-exports, so a `DVec3` crosses between the two as the one type.
glam = "0.32"
# The search state is a map keyed by a system, and a route across the galaxy
# looks at tens of millions of neighbours: `SipHash` is the whole of where
# the time goes. The keys are the index's own numbering, which nobody can
# choose collisions in.
rustc-hash = "2"
tracing = "0.1"

[dev-dependencies]
elite_journal = { path = "../elite_journal" }
# `perf` drives the async `Source` from plain `#[test]`s.
pollster = "0.4"
