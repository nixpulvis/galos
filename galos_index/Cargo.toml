[package]
name = "galos_index"
version = "0.0.2"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2024"
rust-version.workspace = true

# The galaxy's derived spatial index: the on-disk cell tree the builder writes
# beside the database and the reader the client draws from without one. Pure and
# DB-free, so `galos_map` links it without pulling in Postgres. Physics comes from `galos_photometry`; nothing heavier belongs here.
[dependencies]
galos_photometry = { path = "../galos_photometry" }
# The shared domain vocabulary: the enums a body, star and faction are
# described by. Default features only, so no sqlx and no database follow it
# into the client.
elite_journal = { path = "../elite_journal" }
# The metadata sidecars are serde records in a compact binary form. The cells
# stay hand-rolled `FixedCodec`, being fixed-width and read in the millions;
# the metadata is rich, click-depth and still settling, so it rides serde.
# MessagePack rather than a non-self-describing format, since the shared
# `elite_journal` enums carry `#[serde(untagged)]` variants that only a
# self-describing codec can read back.
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
# The vectors and quaternions the orbits are worked out in, which is the one
# thing in here that is arithmetic rather than records. `glam` rather than
# `bevy_math`, which is a re-export of exactly these types: the map and the
# builder both read this crate and only one of them has a renderer.
glam = "0.32"
chrono = { version = "0.4", features = ["serde"] }
# The resume point, the names table, the body shards, the cell payloads and a
# cold build's spill are all mapped rather than read onto the heap: a galaxy's
# worth of any of them is gigabytes.
memmap2 = "0.9"
# The hole punch a sweep reclaims dead records with, which is one `fcntl` on
# macOS and one `fallocate` on Linux and has no safe wrapper in `std`. Nothing
# new in the tree: `memmap2` above already links it.
libc = "0.2"
# The transport seam is async so the one HTTP impl to come is a drop-in; boxed
# so a client holds it behind `Arc<dyn Source>` and swaps FS for HTTP whole.
async-trait = "0.1"

[dev-dependencies]
pollster = "0.3"
# The journal derivation's tests are written as the entries the game writes,
# parsed through `elite_journal` exactly as a reader hands them over.
serde_json = "1"

# No command line here, and no `cli` feature to gate one. `galos index` is a
# verb group of the root crate's binary (`bin/galos/index/`), where the
# readers and the sinks it fills a directory through already were — this
# crate is the format and the reader, which the map and the server link and
# neither wants clap in.
