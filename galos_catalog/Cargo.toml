[package]
name = "galos_catalog"
version = "0.0.1"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2024"
rust-version.workspace = true

# Star catalogs measured from Earth, read into the vocabulary the rest of the
# workspace speaks. A peer of the index build rather than of the database:
# its job is what `galos_db/src/index/mod.rs` does for the Elite dataset —
# read its own data, hand back stars with a position, a magnitude and a
# temperature, and know nothing about the tree or the renderer.
#
# It owns everything between a foreign file and that vocabulary: parsing,
# units, and frames.
[dependencies]
galos_photometry = { path = "../galos_photometry" }
# Catalog rows are quoted CSV with commas inside fields, so this is not a
# `split(',')` job.
csv = "1"
# The `System` bridge and the tree build. Optional rather than plain, so a
# consumer that only wants to read a catalog can drop it and not pull the
# index and its serde stack; see the `index` feature below for why it is on
# by default all the same.
galos_index = { path = "../galos_index", default-features = false, optional = true }

clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli", "index"]
# The `System` bridge and the tree build. On by default so the one corner of
# the workspace nothing calls is at least a corner the workspace compiles: the
# command that would read a catalog into an index directory is not written
# yet, and left off by default the bridge would be the only code here that no
# check ever looks at. A consumer that only wants to read a catalog still
# drops it with `default-features = false`, which is what `galos_sky` does,
# and then neither the index nor its serde stack is pulled.
index = ["dep:galos_index"]
# The `galos-catalog` command, on by default so `cargo run -p galos_catalog`
# just works. A library consumer — `galos_sky`, `galos_db` — drops it with
# `default-features = false` and then clap is never pulled.
cli = ["dep:clap"]

[[bin]]
name = "galos-catalog"
path = "src/main.rs"
required-features = ["cli"]
