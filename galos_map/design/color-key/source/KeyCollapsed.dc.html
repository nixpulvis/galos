<html lang="en">
<head>

<x-dc>
<helmet>

<button style="width: 118px; text-align: left; background: transparent; border: 0; padding: 0; font-family: inherit; font-size: 13px; letter-spacing: 0.08em; color: #b7bcc8; cursor: pointer">ALLEGIANCE</button>
<span style="display: flex; gap: 6px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 17px; height: 17px; border-radius: 3px; box-sizing: border-box; background: #ff5a52"></span><span style="display: inline-block; flex-shrink: 0; width: 17px; height: 17px; border-radius: 3px; box-sizing: border-box; background: #3fdcea"></span><span style="display: inline-block; flex-shrink: 0; width: 17px; height: 17px; border-radius: 3px; box-sizing: border-box; background: #4fdc6a"></span><span style="display: inline-block; flex-shrink: 0; width: 17px; height: 17px; border-radius: 3px; box-sizing: border-box; background: conic-gradient(#f0dd3a 0 30%, #ff8f2e 30% 50%, #6b86ff 50% 65%, #ef62ef 65% 80%, #b3b8c4 80% 100%); border: 2px solid #b3b8c4; opacity: 0.6"></span><span style="margin-left: 4px"><span style="display: inline-block; flex-shrink: 0; width: 17px; height: 17px; border-radius: 3px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #8e94a4;"></span></span></span>
<span style="flex-grow: 1; text-align: right; color: #f0c060">1 hidden</span>
</div>
<div style="margin-left: 30px; align-self: flex-start; min-width: 260px; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: #111319; border: 1px solid #2a2f3b; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
<div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #ff5a52"></span><span style="color: #d7dae2">Federation</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #3fdcea"></span><span style="color: #d7dae2">Empire</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #4fdc6a"></span><span style="color: #d7dae2">Alliance</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: conic-gradient(#f0dd3a 0 30%, #ff8f2e 30% 50%, #6b86ff 50% 65%, #ef62ef 65% 80%, #b3b8c4 80% 100%); border: 2px solid #b3b8c4; opacity: 0.6"></span><span style="color: #d7dae2">Other</span><span style="color: #f0c060; font-size: 14px">6/7</span></div>
<div style="color: #8b91a1; font-size: 13px; padding-top: 4px">click a chip to toggle</div>
</div>
</div><div style="display: flex; flex-direction: column; gap: 10px">
<div style="color: #8b91a1; font-size: 13px; letter-spacing: 0.08em; padding-bottom: 10px">INTERFACE HIDDEN · above the rose</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px 0">
<div style="color: #8b91a1; font-size: 13px; letter-spacing: 0.08em">ALLEGIANCE</div>
<div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #ff5a52"></span><span style="color: #d7dae2">Federation</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #3fdcea"></span><span style="color: #d7dae2">Empire</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: #4fdc6a"></span><span style="color: #d7dae2">Alliance</span></div><div style="display: flex; gap: 10px; align-items: center"><span style="display: inline-block; flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box; background: conic-gradient(#f0dd3a 0 30%, #ff8f2e 30% 50%, #6b86ff 50% 65%, #ef62ef 65% 80%, #b3b8c4 80% 100%); border: 2px solid #b3b8c4; opacity: 0.6"></span><span style="color: #d7dae2">Other</span><span style="color: #f0c060; font-size: 14px">6/7</span></div>
</div>
</div></div>
</div>
</x-dc>

  renderVals(){ return {}; }
