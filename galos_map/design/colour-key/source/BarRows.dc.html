<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour row states</title>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">

<button style="width: 118px; text-align: left; background: transparent; border: 0; padding: 0; font-family: inherit; font-size: 13px; letter-spacing: 0.08em; color: #b7bcc8; cursor: pointer">ALLEGIANCE</button>

<span style="flex-grow: 1; text-align: right; color: #8b91a1">all shown</span>
</div></div><div style="display: flex; flex-direction: column"><div style="color: #8b91a1; font-size: 13px; letter-spacing: 0.08em; padding-bottom: 10px">OTHER HIDDEN · click the Other chip</div><div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
