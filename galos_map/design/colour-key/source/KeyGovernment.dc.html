<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key, Government tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080c}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 560px; height: 900px; box-sizing: border-box; padding: 40px; background: #07080c; color: #d7dae2; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; display: flex; justify-content: center">
<div style="width: 460px; align-self: flex-start; background: #111319; border: 1px solid #2a2f3b; border-radius: 6px; display: flex; flex-direction: column; font-size: 16px">
<div style="display: flex; border-bottom: 1px solid #2a2f3b">
<button aria-pressed="false" style="flex-grow: 1; padding: 11px 0; background: transparent; border: 0; color: #9aa0ae; font-size: 16px; cursor: pointer">Allegiance</button>
<button aria-pressed="true" style="flex-grow: 1; padding: 11px 0; background: #1b1f28; border: 0; color: #e4e7ee; font-size: 16px; cursor: pointer">Government</button>
<button aria-pressed="false" style="flex-grow: 1; padding: 11px 0; background: transparent; border: 0; color: #9aa0ae; font-size: 16px; cursor: pointer">Security</button>
</div>
<div style="display: flex; flex-direction: column; padding: 6px 0">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
<sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
<button style="display: flex; align-items: center; gap: 10px; padding: 9px 14px 4px 14px; background: transparent; border: 0; color: #8b91a1; font-size: 13px; letter-spacing: 0.08em; text-align: left; cursor: pointer">
<span style="{{ r.swatch }}"></span>
<span style="flex-grow: 1">{{ r.label }}</span>
<span style="{{ r.stateStyle }}">{{ r.state }}</span>
</button>
</sc-if>
<sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}">
<button aria-pressed="{{ r.shown }}" style="{{ r.btn }}">
<span style="{{ r.swatch }}"></span>
<span style="{{ r.nameStyle }}">{{ r.name }}</span>
<span style="{{ r.countStyle }}">{{ r.count }}</span>
</button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 18px; padding: 9px 14px 11px 14px; border-top: 1px solid #2a2f3b">
<button style="background: transparent; border: 0; padding: 2px 0; color: #b7bcc8; font-size: 14px; cursor: pointer">all</button>
<button style="background: transparent; border: 0; padding: 2px 0; color: #b7bcc8; font-size: 14px; cursor: pointer">none</button>
<button style="background: transparent; border: 0; padding: 2px 0; color: #b7bcc8; font-size: 14px; cursor: pointer">invert</button>
<span style="flex-grow: 1; text-align: right; color: #8b91a1; font-size: 13px">alt-click: solo</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":900}}'>
var HUE = {red:'#ff5a52', cyan:'#3fdcea', green:'#4fdc6a', yellow:'#f0dd3a', orange:'#ff8f2e', blue:'#6b86ff', magenta:'#ef62ef', grey:'#b3b8c4'};
var G = [
  ['red', [['Communism','1,221',0],['Confederacy','2,442',0],['Dictatorship','2,849',0],['Feudal','1,184',0],['Patronage','2,405',0],['Prison','148',1],['Prison Colony','370',1]]],
  ['cyan', [['Corporate','7,881',0]]],
  ['blue', [['Democracy','6,290',0],['Theocracy','1,110',0]]],
  ['yellow', [['Anarchy','3,478',0]]],
  ['orange', [['Cooperative','2,368',0]]],
  ['green', [['Carrier','740',1],['Megaconstruction','111',1],['Private Ownership','777',1]]],
  ['magenta', [['Engineer','148',0]]],
  ['grey', [['None','1,480',0]]]
];
class Component extends DCLogic {
  renderVals(){
    var rows = [];
    G.forEach(function(g){
      var c = HUE[g[0]], items = g[1], grouped = items.length > 1;
      var shown = items.filter(function(i){ return !i[2]; }).length;
      if(grouped){
        rows.push({isHeader:true, isItem:false, label: g[0].toUpperCase(),
          state: shown === items.length ? 'all' : shown === 0 ? 'none' : shown + '/' + items.length,
          stateStyle: 'color:' + (shown === items.length ? '#8b91a1' : '#f0c060'),
          swatch: shown === items.length ? 'width:11px;height:11px;border-radius:2px;background:' + c : shown === 0 ? 'width:11px;height:11px;border-radius:2px;box-sizing:border-box;border:2px solid ' + c + ';opacity:0.55' : 'width:11px;height:11px;border-radius:2px;box-sizing:border-box;border:2px solid ' + c + ';background:linear-gradient(90deg,' + c + ' 50%,transparent 50%)'});
      }
      items.forEach(function(i){
        var hid = !!i[2];
        rows.push({isHeader:false, isItem:true, name: i[0], count: i[1], shown: !hid,
          btn: 'display:flex;align-items:center;gap:12px;padding:7px 14px 7px ' + (grouped ? 36 : 14) + 'px;background:transparent;border:0;color:inherit;font-size:16px;text-align:left;cursor:pointer;width:100%',
          swatch: hid ? 'width:13px;height:13px;border-radius:3px;box-sizing:border-box;border:2px solid ' + c + ';opacity:0.55' : 'width:13px;height:13px;border-radius:3px;background:' + c,
          nameStyle: 'flex-grow:1;color:' + (hid ? '#7d8494' : '#d7dae2') + ';' + (hid ? 'text-decoration:line-through' : ''),
          countStyle: 'font-size:14px;color:' + (hid ? '#6f7585' : '#9aa0ae')});
      });
    });
    rows.push({isHeader:false, isItem:true, name:'Uninhabited', count:'621,600', shown:true,
      btn: 'display:flex;align-items:center;gap:12px;padding:9px 14px;margin-top:6px;border:0;border-top:1px solid #20242e;background:transparent;color:inherit;font-size:16px;text-align:left;cursor:pointer;width:100%',
      swatch: 'width:13px;height:13px;border-radius:50%;box-sizing:border-box;border:2px dashed #8e94a4',
      nameStyle: 'flex-grow:1;color:#d7dae2', countStyle: 'font-size:14px;color:#9aa0ae'});
    return {rows: rows};
  }
}
</script>
</body>
</html>
