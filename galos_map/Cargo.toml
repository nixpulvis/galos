[package]
name = "galos_map"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true

[features]
inspector = ["bevy-inspector-egui"]
# Profiling, read with Tracy. One feature does two things: `bevy/trace_tracy`
# pulls in bevy's own `trace`, which is what compiles a zone per system, per
# schedule and per render pass and a frame mark per present, and the
# `tracing-tracy` layer that `LogPlugin` then installs, which ships them to a
# profiler over a socket. Nothing in the map changes with it: its own spans
# over the work that happens off the main thread are always compiled and go
# wherever the subscriber sends them, which without this is nowhere.
#
# The wire protocol is versioned and checked when the profiler connects, so
# the profiler has to be the release the client speaks: `tracy-client-sys`
# 0.28, which is what `Cargo.lock` holds, is Tracy 0.13.1. A `cargo update`
# that moves it moves which profiler runs. See the README.
tracy = ["bevy/trace_tracy"]
# The same, and every allocation with it: a second stream, each allocation
# attributed to the zone that was open when it was made. Its own feature
# because it installs a global allocator that reports — worth paying for a
# leak or a per-frame allocation to chase, and a tax on every fetch
# otherwise.
tracy_memory = ["tracy", "bevy/trace_tracy_memory"]

[dependencies]
ab_glyph = "0.2"
bevy = "0.19"
bevy-inspector-egui = { version = "0.37", optional = true }
bevy_egui = "0.40"
# The map's own command line, clap 4 derive as every command line here is.
# `env` is what lets a flag fall back to a variable without reading the
# environment by hand.
clap = { version = "4", features = ["derive", "env"] }
# The face egui draws the chrome in, taken from the crate egui itself takes it
# from rather than copied into `assets`. A name on the map and the same name in
# the bar are then the one typeface, and stay so when egui moves.
epaint_default_fonts = "0.34"
# Bevy 0.19 support is on a branch; the newest release, 0.12, is 0.18 only.
# See https://github.com/aevyrie/big_space/pull/78.
#
# `bevy_camera` is what puts a `Visibility` on the root of a big space.
# Without it the root has none, so neither does it have the
# `InheritedVisibility` that every star hanging off it expects its parent to
# carry, and bevy warns once per star that visibility will not propagate.
big_space = { git = "https://github.com/aevyrie/big_space", branch = "bevy-0.19", features = [
    "i64",
    "bevy_camera",
] }
chrono = "*"
elite_journal = { path = "../elite_journal" }
galos_index = { path = "../galos_index" }
galos_photometry = { path = "../galos_photometry" }
galos_route = { path = "../galos_route" }
# Maps keyed by the index's own numbering — cells and addresses — which
# nobody can choose collisions in, so `SipHash` buys nothing there and costs
# the hot loops most of their time. The map's other maps are keyed by what
# the feed says, and keep the default.
rustc-hash = "2"

[dev-dependencies]
log = "0.4"
# `perf` drives the async `Source` from plain `#[test]`s, with no runtime
# otherwise in the map.
pollster = "0.4"
