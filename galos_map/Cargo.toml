[package]
name = "galos_map"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
inspector = ["bevy-inspector-egui"]
tracy = ["bevy/trace_tracy"]

[dependencies]
ab_glyph = "0.2"
async-std = "*"
bevy = "0.19"
bevy-inspector-egui = { version = "0.37", optional = true }
bevy_egui = "0.40"
bevy_rich_text3d = "0.7"
# The face egui draws the chrome in, taken from the crate egui itself takes it
# from rather than copied into `assets`. A name on the map and the same name in
# the bar are then the one typeface, and stay so when egui moves.
epaint_default_fonts = "0.34"
# Bevy 0.19 support is on a branch; the newest release, 0.12, is 0.18 only.
# See https://github.com/aevyrie/big_space/pull/78.
#
# `bevy_camera` is what puts a `Visibility` on the root of a big space.
# Without it the root has none, so neither does it have the
# `InheritedVisibility` that every star hanging off it expects its parent to
# carry, and bevy warns once per star that visibility will not propagate.
big_space = { git = "https://github.com/aevyrie/big_space", branch = "bevy-0.19", features = [
    "i64",
    "bevy_camera",
] }
chrono = "*"
elite_journal = { path = "../elite_journal" }
galos_index = { path = "../galos_index", default-features = false }
pathfinding = "4"

[dev-dependencies]
log = "0.4"
