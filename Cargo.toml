[package]
name = "galos"
version = "0.0.3"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2018"
rust-version.workspace = true

default-run = "galos"

[dependencies]
async-std = "*"
# The CLI's parser and the terminal UI's command line are the same parser, so
# what one accepts the other does. `wrap_help` because the help is read in a
# terminal of whatever width it happens to be.
clap = { version = "4", features = ["derive", "wrap_help"] }
# A line typed at the terminal UI is split the way a shell would split it,
# quotes and all, before that parser is handed it. `galos route "Alpha
# Centauri" Sol` means one system and not two either way it is typed.
shlex = "2"
itertools = "*"
indicatif = "*"
chrono = "*"
eddb = { path = "./eddb" }
edsm = { path = "./edsm" }
galos_db = { path = "./galos_db" }
elite_journal = { path = "./elite_journal" }
prettytable-rs = "*"
ratatui = "0.30"
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
# `galos_map` is a workspace member and is not depended on here. Nothing in
# `galos` calls into it, and having it on this list means bevy, wgpu and naga
# are compiled before the CLI can be type-checked — minutes, for a crate the
# CLI never mentions. `cargo check -p galos_map` builds the map.

[target.'cfg(unix)'.dependencies]
eddn = { path = "./eddn" }

[patch.crates-io]
# elite_dat     = { path = './elite_dat' }
eddb = { path = "./eddb" }
eddn = { path = "./eddn" }
edsm = { path = "./edsm" }
elite_journal = { path = "./elite_journal" }

[workspace.package]
# Set by bevy 0.19, the highest floor anything here depends on, and well above
# the 1.85 that galos_map's edition needs.
#
# Inherited by the crates kept in this repository. The other members are
# submodules with their own release cycles, and a crate that inherits this
# cannot be built outside the workspace.
rust-version = "1.95.0"

[workspace]
# Resolver 2 keeps platform-specific dependency features from being unified
# across targets we aren't building. bevy_shader depends on naga_oil with
# default features only under wasm32; under resolver 1 that leaks naga_oil's
# `glsl` feature into native builds, where naga's GLSL backend panics while
# bevy validates composed shaders.
resolver = "2"
members = [
    # "elite_dat",
    "elite_journal",
    "eddn",
    "eddb",
    "edsm",
    "galos_db",
    "galos_map",
    # "galos_gui",
    "galos_server",
    # "galos_worker",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
