[package]
name = "galos"
version = "0.0.4"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2018"
rust-version.workspace = true

default-run = "galos"

# One binary: `galos index …` and `galos db …` are the two stores, `galos
# search`/`route` the questions. Built `--no-default-features` it is the
# index group alone, with no database client in it — see `bin/galos/main.rs`.
[[bin]]
name = "galos"
path = "bin/galos/main.rs"

[features]
# Postgres. On by default, because most of what this does is about a
# database; off is how the binary is built for a machine that has none, and
# it then contains no `sqlx`, no `dotenv` and no `DATABASE_URL` — just the
# `index` verbs, which is everything a directory needs.
default = ["db"]
db = ["dep:galos_db", "dep:galos_catalog"]

[dependencies]
# `attributes` is `#[async_std::main]`. It arrived transitively through
# `galos_db` before the `db` feature could be turned off under it.
async-std = { version = "1", features = ["attributes"] }
# `env` is `GALOS_INDEX`: the index directory a verb works on is named the
# same way in the map (`galos_map`, which has read it from there since
# before this), so a reader who exports it once is obeyed by both.
clap = { version = "4", features = ["derive", "env"] }
itertools = "0.14"
indicatif = "0.17"
chrono = "0.4"
eddb = { path = "./eddb" }
eddn = { path = "./eddn" }
edsm = { path = "./edsm" }
# Spansh's galaxy dumps, read a line at a time.
spansh = { path = "./spansh" }
# Optional, which is the `db` feature: with it off the binary is built
# without a database client in it. See `bin/galos/main.rs`.
galos_db = { path = "./galos_db", optional = true }
# The HYG catalog reader, for `galos db catalog`. Optional with the database
# rather than beside it: what the verb does with what it reads is a query,
# so a build with no database in it has nothing to compare a survey against.
# Default features off, the same as `galos_db` takes it: the tree bridge and
# a command line of its own are not wanted here.
galos_catalog = { path = "./galos_catalog", default-features = false, optional = true }
# The index format and the event accumulator that fills it. Both stores are
# filled from the same readings, and the accumulator that turns an event
# into one lives here whichever store is being written to. Default features
# off, so no command line follows them in.
galos_index = { path = "./galos_index", default-features = false }
# The journal's events, and the reader that tails a directory of them.
elite_journal = { path = "./elite_journal", features = ["watch"] }
prettytable-rs = "0.10"
serde_json = "1"
serde = "1"
# Where a stopped cold build's place in the dump is written: `Build::mark`
# carries a caller's bytes and `galos_index` writes its own metadata as
# MessagePack, so the one caller with a place to keep encodes it the same
# way.
rmp-serde = "1"
# `Sink` is a boxed trait with async methods on it.
async-trait = "0.1"
# The EDDN subscription parks the OS thread it runs on, so it runs on one of
# its own and hands what it read to the async side through a channel. The
# same channel carries what the index worker derives from.
async-channel = "2"
# Ctrl-C has to end in a last publish, a whole-directory `finish()` and a
# resume point rather than in a killed process, which is a handler rather
# than the default action. Both store groups install it, and the `index`
# group's one-pass verbs read the same flag between shards.
ctrlc = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Driving the async `Sink` methods from a `#[test]`, which has no runtime.
pollster = "0.3"
# `derivations_agree` writes to a database of its own, made and dropped by
# `galos_db::testing`. The same dependency as above with one more feature,
# which a dev-dependency is how to ask for.
galos_db = { path = "./galos_db", features = ["testing"] }

[patch.crates-io]
# elite_dat     = { path = './elite_dat' }
eddb = { path = "./eddb" }
eddn = { path = "./eddn" }
edsm = { path = "./edsm" }
elite_journal = { path = "./elite_journal" }

[workspace.package]
# Set by bevy 0.19, the highest floor anything here depends on, and well above
# the 1.85 that galos_map's edition needs.
#
# Inherited by the crates kept in this repository. The other members are
# submodules with their own release cycles, and a crate that inherits this
# cannot be built outside the workspace.
rust-version = "1.95.0"

[workspace]
# Resolver 2 keeps platform-specific dependency features from being unified
# across targets we aren't building. bevy_shader depends on naga_oil with
# default features only under wasm32; under resolver 1 that leaks naga_oil's
# `glsl` feature into native builds, where naga's GLSL backend panics while
# bevy validates composed shaders.
resolver = "2"
members = [
    # "elite_dat",
    "elite_journal",
    "spansh",
    "eddn",
    "eddb",
    "edsm",
    "galos_db",
    "galos_photometry",
    "galos_index",
    "galos_catalog",
    "galos_sky",
    "galos_map",
    # "galos_gui",
    "galos_server",
    # "galos_worker",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
