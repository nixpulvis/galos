[package]
name = "galos"
version = "0.0.4"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2018"
rust-version.workspace = true

default-run = "galos"

[dependencies]
async-std = "*"
structopt = "*"
# `galos-sync` is clap 4 derive, as every command line written since is.
# `structopt` stays for `galos`, the query CLI, which has not been moved.
clap = { version = "4", features = ["derive"] }
itertools = "*"
indicatif = "*"
chrono = "*"
eddb = { path = "./eddb" }
eddn = { path = "./eddn" }
edsm = { path = "./edsm" }
galos_db = { path = "./galos_db" }
# The index format, and the journal read into it. `galos-sync` writes to either
# a database or an index directory, and the second of those needs both: the
# tree and its metadata records from one, the event accumulator from the other.
# Default features off on both, so neither command line follows them in here.
galos_index = { path = "./galos_index", default-features = false }
galos_journal = { path = "./galos_journal", default-features = false }
elite_journal = { path = "./elite_journal" }
prettytable-rs = "*"
serde_json = "*"
serde = "1"
# `galos-sync`'s `Sink` is a boxed trait with async methods on it.
async-trait = "0.1"
# The EDDN subscription parks the OS thread it runs on, so it runs on one of
# its own and hands what it read to the async side through a channel. The
# same channel carries what the index worker derives from.
async-channel = "2"
# Nothing in the workspace handled a signal before this. `galos-sync` is a
# supervisor now: Ctrl-C has to end in a last publish, a whole-directory
# `finish()` and a resume point rather than in a killed process.
ctrlc = "3"
tui = "*"
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
galos_map = { path = "./galos_map", optional = true }

[dev-dependencies]
# Driving the async `Sink` methods from a `#[test]`, which has no runtime.
pollster = "0.3"

[target.'cfg(unix)'.dependencies]
termion = "*"

[patch.crates-io]
# elite_dat     = { path = './elite_dat' }
eddb = { path = "./eddb" }
eddn = { path = "./eddn" }
edsm = { path = "./edsm" }
elite_journal = { path = "./elite_journal" }

[workspace.package]
# Set by bevy 0.19, the highest floor anything here depends on, and well above
# the 1.85 that galos_map's edition needs.
#
# Inherited by the crates kept in this repository. The other members are
# submodules with their own release cycles, and a crate that inherits this
# cannot be built outside the workspace.
rust-version = "1.95.0"

[workspace]
# Resolver 2 keeps platform-specific dependency features from being unified
# across targets we aren't building. bevy_shader depends on naga_oil with
# default features only under wasm32; under resolver 1 that leaks naga_oil's
# `glsl` feature into native builds, where naga's GLSL backend panics while
# bevy validates composed shaders.
resolver = "2"
members = [
    # "elite_dat",
    "elite_journal",
    "eddn",
    "eddb",
    "edsm",
    "galos_db",
    "galos_photometry",
    "galos_index",
    "galos_journal",
    "galos_catalog",
    "galos_sky",
    "galos_map",
    # "galos_gui",
    "galos_server",
    # "galos_worker",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
