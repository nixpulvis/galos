[package]
name = "galos_factory"
version = "0.0.1"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2021"

[features]
default = ["ui"]
ui = ["bevy/default", "dep:bevy_egui"]

[dependencies]
# Pure serde journal/EDDN types (no sqlx in default features), so snapshots
# speak the same vocabulary as galos_db rows and the live sync.
elite_journal = { path = "../elite_journal" }
bevy = { version = "0.14", default-features = false, features = ["bevy_state"] }
bevy_egui = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[[bin]]
name = "galos-factory"
path = "src/main.rs"
