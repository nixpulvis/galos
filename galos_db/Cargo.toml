[package]
name = "galos_db"
version = "0.0.4"
authors = ["Nathan Lilienthal <nathan@nixpulvis.com>"]
edition = "2018"
rust-version.workspace = true

[features]
# `galos_db::testing`, which hands a test a migrated database of its own and
# drops it again. Not on by default: nothing in an ordinary build has any
# business creating databases.
testing = ["dep:libc"]

[dev-dependencies]
# The write-path tests are integration tests, which link the library as any
# other caller does and see only what a feature turns on. A test target has
# no other way to ask for a feature of the crate it tests.
galos_db = { path = ".", features = ["testing"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
# The cold build reads `systems` and `stars` as two ordered cursors and
# merges them, so neither is ever a buffer: `sqlx`'s streaming `fetch` hands
# back a `BoxStream`, and this is where that type is named. Already in the
# tree under sqlx; nothing new is pulled by asking for it.
futures-core = "0.3"
async-std = { version = "*", features = [ "attributes" ] }
dotenv = "*"
chrono = "*"
pathfinding = "*"
ordered-float = "*"
# The write paths say when they turn a message away for being older than what
# is on record. A refusal is otherwise a no-op that leaves no trace, so a feed
# looks equally healthy whether the guards are working or never firing.
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
elite_journal = { path = "../elite_journal", features = ["with-postgis-sqlx"] }
# A coordinate is written and read as a geometry column here, which is what
# `with-postgis-sqlx` is: geozero's own `Encode`, `Decode` and `Type` for the
# wrappers the queries name. Asked for here rather than taken from whatever
# `elite_journal` happens to turn on, this being the crate that speaks to the
# database.
geozero = { version = "0.15", features = ["with-wkb", "with-postgis-sqlx"] }
galos_index = { path = "../galos_index" }
galos_photometry = { path = "../galos_photometry" }
# The other dataset: read for the cross-comparison in `catalog`, which is the
# only place this crate meets a survey that is not Elite.
galos_catalog = { path = "../galos_catalog", default-features = false }
# `testing`'s reaper asks whether the process that made a leftover database is
# still running, which is a signal sent to nobody.
libc = { version = "0.2", optional = true }

[dependencies.sqlx]
version = "^0.8"
features = ["runtime-async-std-native-tls", "postgres", "chrono"]
